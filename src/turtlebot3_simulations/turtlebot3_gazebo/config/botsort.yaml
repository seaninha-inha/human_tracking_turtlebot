# Ultralytics BoT-SORT tracker settings used by yolo_depth_follower.
# Copy of the upstream defaults so you can tune tracking behavior locally.

tracker_type: botsort
track_high_thresh: 0.25
track_low_thresh: 0.1
new_track_thresh: 0.25
track_buffer: 150
match_thresh: 0.8
fuse_score: True

gmc_method: sparseOptFlow

proximity_thresh: 0.5
appearance_thresh: 0.8
with_reid: False
model: auto
